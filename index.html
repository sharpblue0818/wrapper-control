<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrapper Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#edf4ff;font-family:system-ui}main{width:min(920px,calc(100% - 32px));margin:auto;padding:40px 0}h1{font-size:clamp(2.5rem,7vw,4.5rem);letter-spacing:-.06em;margin:0 0 10px}.muted{color:#9baac1}.panel{margin:20px 0;padding:20px;border:1px solid #30405c;border-radius:16px;background:#0c111e}.fields{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}label{display:block;margin-bottom:6px;font-weight:700}input{width:100%;padding:12px;border:1px solid #30405c;border-radius:9px;background:#070b14;color:#fff}button{padding:11px 15px;border:0;border-radius:9px;background:#79e8ff;color:#07101a;font-weight:800;cursor:pointer}.danger{background:#ff7294}.secondary{background:#66748b;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:10px;border:1px solid #26324a;border-radius:9px}.row small{display:block;color:#7f90ab}.preview{width:100%;height:420px;margin-top:14px;border:1px solid #30405c;border-radius:12px;background:#fff}@media(max-width:700px){.fields,.row{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head><body><main><h1>Wrapper Control</h1><p class="muted">Generate iframe wrappers and publish global bans through <code>wrapper-status.json</code>.</p>
<section class="panel"><h2>Create wrapper</h2><div class="fields"><div><label>Name</label><input id="name" placeholder="My site"></div><div><label>Actual URL</label><input id="url" type="url" placeholder="https://example.com/"></div><div><label>File name</label><input id="filename" placeholder="my-site.html"></div></div><div class="actions"><button id="test">Test embedding</button><button id="create" disabled>Create wrapper</button></div><iframe id="preview" class="preview" hidden referrerpolicy="no-referrer"></iframe></section>
<section class="panel"><h2>Manage generated wrappers</h2><p class="muted">After changing bans, download the status file and replace <code>wrapper-status.json</code> in the GitHub repository.</p><div id="list" class="list"></div><div class="actions"><button id="export">Download wrapper-status.json</button></div></section>
<script>
const STATUS_URL='https://sharpblue0818.github.io/wrapper-control/wrapper-status.json';
const nameInput=document.querySelector('#name'),urlInput=document.querySelector('#url'),filenameInput=document.querySelector('#filename'),preview=document.querySelector('#preview'),createButton=document.querySelector('#create'),list=document.querySelector('#list');
let registry=JSON.parse(localStorage.getItem('wrapper-registry')||'[]'),banned=new Set(JSON.parse(localStorage.getItem('wrapper-banned')||'[]'));
function save(){localStorage.setItem('wrapper-registry',JSON.stringify(registry));localStorage.setItem('wrapper-banned',JSON.stringify([...banned]));render()}
function render(){list.textContent='';if(!registry.length){list.innerHTML='<span class="muted">No wrappers generated yet.</span>';return}for(const item of registry){const row=document.createElement('div');row.className='row';const info=document.createElement('span');info.innerHTML=`${escapeHtml(item.name)}<small>${escapeHtml(item.id)}</small>`;const toggle=document.createElement('button');toggle.textContent=banned.has(item.id)?'Unban':'Ban';toggle.className=banned.has(item.id)?'':'danger';toggle.onclick=()=>{banned.has(item.id)?banned.delete(item.id):banned.add(item.id);save()};const remove=document.createElement('button');remove.textContent='Delete from list';remove.className='secondary';remove.onclick=()=>{registry=registry.filter(x=>x.id!==item.id);banned.delete(item.id);save()};row.append(info,toggle,remove);list.append(row)}}
nameInput.addEventListener('input',()=>{if(!filenameInput.dataset.edited)filenameInput.value=(nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'site')+'.html'});filenameInput.addEventListener('input',()=>filenameInput.dataset.edited='1');urlInput.addEventListener('input',()=>createButton.disabled=true);
document.querySelector('#test').onclick=()=>{try{preview.src=new URL(urlInput.value).href;preview.hidden=false;createButton.disabled=false}catch{alert('Enter a valid URL.')}};
createButton.onclick=()=>{const name=nameInput.value.trim()||'Wrapped site',url=new URL(urlInput.value).href,id=crypto.randomUUID(),meta=JSON.stringify({id,name,url}).replace(/</g,'\\u003c');const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(name)}</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}.blocked{position:fixed;inset:0;display:none;place-items:center;background:#070b14;color:white;font-family:system-ui;text-align:center}.blocked.show{display:grid}.blocked h1{color:#ff7294}</style></head><body><iframe id="site" referrerpolicy="no-referrer"></iframe><div id="blocked" class="blocked"><div><h1>Access disabled</h1><p>This wrapper has been remotely banned.</p></div></div><script>const META=${meta},STATUS_URL=${JSON.stringify(STATUS_URL)},site=document.querySelector('#site'),blocked=document.querySelector('#blocked');let isBlocked=null;function apply(value){if(isBlocked===value)return;isBlocked=value;blocked.classList.toggle('show',value);site.src=value?'about:blank':META.url}async function check(){try{const response=await fetch(STATUS_URL+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error(response.status);const data=await response.json();apply((data.banned||[]).includes(META.id))}catch(error){console.warn('Status check failed',error);if(isBlocked===null)apply(false)}}check();setInterval(check,5000);<\/script></body></html>`;download((filenameInput.value||'site.html').replace(/[^a-zA-Z0-9._-]/g,'-'),html,'text/html');registry.push({id,name,url});save()};
document.querySelector('#export').onclick=()=>download('wrapper-status.json',JSON.stringify({banned:[...banned]},null,2)+'\n','application/json');
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name.endsWith('.html')||name.endsWith('.json')?name:name+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></main></body></html>
