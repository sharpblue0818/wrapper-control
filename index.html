<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wrapper Control</title>
<style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#edf4ff;font-family:system-ui}main{width:min(940px,calc(100% - 32px));margin:auto;padding:40px 0}h1{font-size:clamp(2.5rem,7vw,4.5rem);letter-spacing:-.06em;margin:0}.muted{color:#9baac1}.panel{margin:20px 0;padding:20px;border:1px solid #30405c;border-radius:16px;background:#0c111e}.fields{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}label{display:block;margin-bottom:6px;font-weight:700}input{width:100%;padding:12px;border:1px solid #30405c;border-radius:9px;background:#070b14;color:#fff}button{padding:11px 15px;border:0;border-radius:9px;background:#79e8ff;color:#07101a;font-weight:800;cursor:pointer}.danger{background:#ff7294}.secondary{background:#66748b;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:10px;border:1px solid #26324a;border-radius:9px}.row small{display:block;color:#7f90ab}.preview{width:100%;height:420px;margin-top:14px;border:1px solid #30405c;border-radius:12px;background:#fff}.status{color:#79e8ff}@media(max-width:700px){.fields,.row{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head>
<body><main><h1>Wrapper Control</h1><p class="muted">Create wrappers and ban or unban them remotely from any computer.</p>
<section class="panel"><h2>Connect administrator</h2><div class="fields"><div style="grid-column:span 2"><label>Worker URL</label><input id="api" placeholder="https://wrapper-control-api.your-name.workers.dev"></div><div><label>Admin password</label><input id="key" type="password" autocomplete="current-password"></div></div><div class="actions"><button id="connect">Connect</button></div><p id="connection" class="status">Not connected.</p></section>
<section class="panel"><h2>Create wrapper</h2><div class="fields"><div><label>Name</label><input id="name" placeholder="My site"></div><div><label>Actual URL</label><input id="url" type="url" placeholder="https://example.com/"></div><div><label>File name</label><input id="filename" placeholder="my-site.html"></div></div><div class="actions"><button id="test">Test embedding</button><button id="create" disabled>Create wrapper</button></div><iframe id="preview" class="preview" hidden referrerpolicy="no-referrer"></iframe></section>
<section class="panel"><h2>Manage generated wrappers</h2><div id="list" class="list"><span class="muted">Connect to load wrappers.</span></div></section>
<script>
const $=s=>document.querySelector(s),apiInput=$('#api'),keyInput=$('#key'),connection=$('#connection'),nameInput=$('#name'),urlInput=$('#url'),filenameInput=$('#filename'),preview=$('#preview'),createButton=$('#create'),list=$('#list');let registry=[],banned=new Set;
apiInput.value=localStorage.getItem('worker-api-url')||'https://wrapper-control-api.sharpblue0818.workers.dev';
function api(path){return apiInput.value.trim().replace(/\/$/,'')+path}
async function admin(action,data={}){const response=await fetch(api('/admin'),{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({key:keyInput.value,action,...data})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||`HTTP ${response.status}`);return result}
async function connect(){try{connection.textContent='Connecting…';const data=await admin('list');registry=data.wrappers||[];localStorage.setItem('worker-api-url',apiInput.value.trim());await refreshStates();connection.textContent='Connected.';render()}catch(error){connection.textContent='Connection failed: '+error.message}}
async function refreshStates(){banned.clear();await Promise.all(registry.map(async item=>{try{const response=await fetch(api('/status/'+item.id),{cache:'no-store'});const state=await response.json();if(state.banned)banned.add(item.id)}catch{}}))}
async function setState(id,value){try{await admin('state',{id,banned:value});value?banned.add(id):banned.delete(id);render()}catch(error){alert(error.message)}}
async function removeItem(id){if(!confirm('Ban this wrapper permanently and delete it from the control list?'))return;try{await admin('delete',{id});registry=registry.filter(item=>item.id!==id);banned.delete(id);render()}catch(error){alert(error.message)}}
function render(){list.textContent='';if(!registry.length){list.innerHTML='<span class="muted">No wrappers registered.</span>';return}for(const item of registry){const row=document.createElement('div');row.className='row';const info=document.createElement('span');info.innerHTML=`${escapeHtml(item.name)}<small>${escapeHtml(item.id)}</small>`;const toggle=document.createElement('button');const stopped=banned.has(item.id);toggle.textContent=stopped?'Unban':'Ban';toggle.className=stopped?'':'danger';toggle.onclick=()=>setState(item.id,!stopped);const remove=document.createElement('button');remove.textContent='Delete + ban';remove.className='secondary';remove.onclick=()=>removeItem(item.id);row.append(info,toggle,remove);list.append(row)}}
$('#connect').onclick=connect;nameInput.addEventListener('input',()=>{if(!filenameInput.dataset.edited)filenameInput.value=(nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'site')+'.html'});filenameInput.addEventListener('input',()=>filenameInput.dataset.edited='1');urlInput.addEventListener('input',()=>createButton.disabled=true);
$('#test').onclick=()=>{try{preview.src=new URL(urlInput.value).href;preview.hidden=false;createButton.disabled=false}catch{alert('Enter a valid URL.')}};
createButton.onclick=async()=>{if(!apiInput.value||!keyInput.value){alert('Connect the administrator first.');return}const name=nameInput.value.trim()||'Wrapped site',url=new URL(urlInput.value).href,id=crypto.randomUUID(),meta=JSON.stringify({id,name,url}).replace(/</g,'\\u003c'),workerUrl=apiInput.value.trim().replace(/\/$/,'');try{await admin('register',{id,name,url})}catch(error){alert('Could not register wrapper: '+error.message);return}const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(name)}</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}.blocked{position:fixed;inset:0;display:grid;place-items:center;background:#070b14;color:white;font-family:system-ui;text-align:center;padding:24px}.blocked.hide{display:none}.blocked h1{color:#ff7294}.blocked button{padding:11px 16px;border:0;border-radius:9px;background:#79e8ff;color:#07101a;font-weight:800;cursor:pointer}</style></head><body><iframe id="site" referrerpolicy="no-referrer"></iframe><div id="blocked" class="blocked"><div><h1 id="message-title">Connecting…</h1><p id="message-text">Requesting the single available session.</p><button id="retry" hidden>Try again</button></div></div><script>const META=${meta},API=${JSON.stringify(workerUrl)},site=document.querySelector('#site'),blocked=document.querySelector('#blocked'),title=document.querySelector('#message-title'),message=document.querySelector('#message-text'),retry=document.querySelector('#retry');let socket=null,connected=false,banned=false;function show(t,m,canRetry=false){blocked.classList.remove('hide');title.textContent=t;message.textContent=m;retry.hidden=!canRetry;site.src='about:blank'}function connect(){if(banned||socket)return;show('Connecting…','Requesting the single available session.');const ws=new WebSocket(API.replace(/^http/,'ws')+'/session/'+META.id);socket=ws;ws.onopen=()=>{if(socket!==ws){ws.close();return}connected=true;blocked.classList.add('hide');site.src=META.url};ws.onerror=()=>{};ws.onclose=()=>{if(socket!==ws)return;socket=null;connected=false;if(!banned)show('Already in use','Only one person can use this wrapper at a time.',true)}}retry.onclick=connect;async function checkBan(){try{const r=await fetch(API+'/status/'+META.id+'?t='+Date.now(),{cache:'no-store'}),d=await r.json();if(!r.ok)return;const wasBanned=banned;banned=!!d.banned;if(banned){if(socket)socket.close();show('Access disabled','This wrapper has been remotely banned.')}else if(wasBanned&&!connected)connect()}catch(e){console.warn(e)}}checkBan().then(()=>{if(!banned)connect()});setInterval(checkBan,5000);setInterval(()=>{if(socket&&socket.readyState===1)socket.send('ping')},25000);addEventListener('beforeunload',()=>{if(socket)socket.close()});<\/script></body></html>`;download((filenameInput.value||'site.html').replace(/[^a-zA-Z0-9._-]/g,'-'),html);registry.push({id,name,url});render()};
function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/html'}));a.download=name.toLowerCase().endsWith('.html')?name:name+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></main></body></html>
